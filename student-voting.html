<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMS Faculty Election 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 3px 14px #0001}h1{margin-top:0}input{box-sizing:border-box}.verifyInput{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccd3da;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;background:#1769aa;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#68737d}.msg{padding:12px;border-radius:8px;background:#eef5ff;margin:12px 0}.err{background:#fff0f0;color:#9b1c1c}.success{background:#eefbf1;color:#176b2c}.candidate{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;background:#fff}.candidate:hover{border-color:#1769aa}.candidate.selected{border:2px solid #1769aa;background:#f1f7fc}.candidate label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.candidate input{margin-top:4px}.candidate img{width:70px;height:70px;object-fit:cover;border-radius:9px}.candidateInfo{flex:1}.manifesto{margin-top:8px;color:#4b5563;line-height:1.45}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.progress{font-size:14px;color:#667085;margin-bottom:10px}.review{border-left:4px solid #1769aa;padding:10px 14px;margin:10px 0;background:#f7fbff}.small{font-size:13px;color:#667085}</style></head><body><div class="wrap"><div class="card"><h1>BMS Faculty Election 2026</h1><p>University of Delta, Agbor</p><div id="msg" class="msg">Enter your registered name and matric number to verify your eligibility.</div><div id="verify"><label>Full name</label><input class="verifyInput" id="name" placeholder="Enter your full name"><label>Matric number</label><input class="verifyInput" id="matric" placeholder="Enter your matric number"><button id="verifyBtn">Verify voter</button></div><div id="publicResults" style="display:none"></div><div id="ballot" style="display:none"></div></div></div><script>
const {createClient}=supabase;const db=createClient('https://dlzjnxhvcysknajtxhij.supabase.co','sb_publishable_xl4C_1obFH_6z-thh_eMBw_0M2RMHpu');
const ELECTION='024a7a81-13dc-4fb2-adff-4851a29e0084';let voter=null,verificationToken=null,positions=[],candidates=[],current=0,selections={};
const msg=document.getElementById('msg');loadPublicResults();function show(t,c='msg'){msg.className=c;msg.textContent=t}
async function loadPublicResults(){
  const box=document.getElementById('publicResults');
  try{
    const {data,error}=await db.rpc('get_election_results',{p_election_id:ELECTION});
    if(error||!data||data.published!==true){box.style.display='none';return}
    let html='<h2>Election Results</h2><p class="msg success">Results have been officially displayed by the electoral chairman.</p>';
    html+=`<div class="review"><strong>Eligible to vote</strong><br><span style="font-size:24px;font-weight:800">${data.eligible_voters}</span></div>`;
    html+=`<div class="review"><strong>People who voted</strong><br><span style="font-size:24px;font-weight:800">${data.voted_voters}</span></div>`;
    for(const p of (data.positions||[])){
      html+=`<div class="review"><h3 style="margin-top:0">${esc(p.position_name)}</h3>`;
      for(const c of (p.candidates||[])) html+=`<div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding:9px 0"><span>${esc(c.candidate_name)}</span><strong>${c.votes} vote${c.votes===1?'':'s'}</strong></div>`;
      if(p.nil_votes>0||!(p.candidates||[]).length) html+=`<div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding:9px 0"><span>Nil</span><strong>${p.nil_votes} vote${p.nil_votes===1?'':'s'}</strong></div>`;
      html+='</div>';
    }
    box.innerHTML=html;box.style.display='block';
  }catch(e){box.style.display='none'}
}
async function verify(){const name=document.getElementById('name').value.trim(),matric=document.getElementById('matric').value.trim();if(!name||!matric)return show('Please enter both your full name and matric number.','msg err');document.getElementById('verifyBtn').disabled=true;show('Verifying...');try{const {data,error}=await db.rpc('verify_voter',{p_election_id:ELECTION,p_matric_number:matric,p_full_name:name});if(error)throw error;if(!data||!data.length)throw new Error('Voter details could not be verified.');voter=data[0];verificationToken=voter.verification_token;await loadBallot();if(voter.has_voted){renderVotedBallot(voter.voted_selections||[]);}}catch(e){show(e.message||'Verification failed.','msg err')}finally{document.getElementById('verifyBtn').disabled=false}}
async function loadBallot(){const [{data:p,error:pe},{data:c,error:ce},{data:election,error:ee}]=await Promise.all([db.from('positions').select('*').eq('election_id',ELECTION).order('display_order'),db.from('candidates').select('*').eq('active',true).order('display_order'),db.from('elections').select('status,starts_at,ends_at').eq('id',ELECTION).single()]);if(pe||ce||ee)throw(pe||ce||ee);positions=p||[];candidates=c||[];if(!positions.length)throw new Error('No voting positions have been configured yet.');document.getElementById('verify').style.display='none';document.getElementById('ballot').style.display='block';if(!voter.has_voted&&election.status!=='open')throw new Error('Voting is not currently open.');if(!voter.has_voted)renderPosition()}
function renderVotedBallot(voted){const byPosition={};(voted||[]).forEach(v=>byPosition[v.position_id]=v.candidate_id);let html='<h2>Your submitted vote</h2><p class="msg success">You have already voted. You can log in again to view your selections, but you cannot vote again.</p>';positions.forEach(p=>{const cs=candidates.filter(c=>c.position_id===p.id);const cid=Object.prototype.hasOwnProperty.call(byPosition,p.id)?byPosition[p.id]:undefined;const choice=cid===null?'Nil':(cs.find(c=>c.id===cid)||{}).full_name||'No recorded selection';html+=`<div class="review"><strong>${esc(p.name)}</strong><br><span>${esc(choice)}</span><div class="small" style="margin-top:6px">Your recorded selection</div></div>`});document.getElementById('ballot').innerHTML=html;show('You have already voted. Your recorded selections are shown below.','msg success')}
function renderPosition(){if(current>=positions.length)return renderReview();const p=positions[current],cs=candidates.filter(c=>c.position_id===p.id);let html=`<div class="progress">Position ${current+1} of ${positions.length}</div><h2>${esc(p.name)}</h2><p>${cs.length===1?'One candidate is contesting this position. You may vote for the candidate or choose Nil.':'Select one candidate for this position.'}</p>`;if(!cs.length)html+='<p class="msg err">No active candidates for this position. Please contact the election administrator.</p>';cs.forEach(c=>{const sel=selections[p.id]===c.id;html+=`<div class="candidate ${sel?'selected':''}" onclick="choose('${esc(c.id)}','${esc(p.id)}')"><label><input type="radio" name="currentPosition" ${sel?'checked':''} onchange="choose('${esc(c.id)}','${esc(p.id)}')"><div class="candidateInfo">${c.photo_url?`<img src="${esc(c.photo_url)}" alt="Candidate photo">`:''}<strong>${esc(c.full_name)}</strong>${c.department?`<div class="small">${esc(c.department)}</div>`:''}<div class="manifesto">${c.manifesto?esc(c.manifesto):'No manifesto provided.'}</div></div></label><div class="clear"></div></div>`});if(cs.length===1){const nil=selections[p.id]===null;html+=`<div class="candidate ${nil?'selected':''}" onclick="chooseNil('${esc(p.id)}')"><label><input type="radio" name="currentPosition" ${nil?'checked':''}><div class="candidateInfo"><strong>Nil</strong><div class="small">I choose not to vote for this candidate.</div></div></label></div>`}html+=`<div class="nav">${current>0?'<button class="secondary" onclick="prevPosition()">Back</button>':'<span></span>'}<button id="nextBtn" onclick="nextPosition()">${current===positions.length-1?'Review vote':'Next'}</button></div>`;document.getElementById('ballot').innerHTML=html;show('You are verified. Your selection is kept as you move between positions.','msg success')}
function choose(cid,pid){selections[pid]=cid;renderPosition()}
function chooseNil(pid){selections[pid]=null;renderPosition()}
function nextPosition(){const p=positions[current];const cs=candidates.filter(c=>c.position_id===p.id);if(cs.length===0)return show(`No active candidate is available for ${p.name}.`,'msg err');if(!(p.id in selections))return show(`Please select an option for ${p.name}.`,'msg err');if(cs.length!==1&&selections[p.id]===null)return show(`Nil is only available when exactly one candidate is contesting ${p.name}.`,'msg err');current++;renderPosition()}
function prevPosition(){if(current>0)current--;renderPosition()}
function renderReview(){let html='<h2>Review your vote</h2><p>Check your selections before submitting. You can go back and change any selection.</p>';positions.forEach((p,i)=>{const c=candidates.find(x=>x.id===selections[p.id]);const choice=selections[p.id]===null?'Nil':(c?esc(c.full_name):'No selection');html+=`<div class="review"><strong>${esc(p.name)}</strong><br>${choice}<br><button class="secondary" style="margin-top:8px" onclick="editPosition(${i})">Change</button></div>`});html+='<div class="nav"><button class="secondary" onclick="prevPosition()">Back</button><button id="submitBtn" onclick="submitVote()">Submit Vote</button></div>';document.getElementById('ballot').innerHTML=html;show('Review everything carefully before submitting.','msg')}
function editPosition(i){current=i;renderPosition()}
async function submitVote(){const btn=document.getElementById('submitBtn');const selectionsArray=positions.map(p=>({position_id:p.id,candidate_id:selections[p.id]}));if(selectionsArray.some(x=>!(x.position_id in selections)))return show('Please select an option for every position.','msg err');if(!confirm('Submit your vote? You will not be able to vote again.'))return;btn.disabled=true;show('Submitting your vote...');try{const {data,error}=await db.rpc('cast_votes',{p_election_id:ELECTION,p_verification_token:verificationToken,p_selections:selectionsArray});if(error)throw error;show('Your vote has been submitted successfully. Thank you for voting.','msg success');document.getElementById('ballot').innerHTML='<h2>Vote submitted</h2><p>Your vote has been recorded successfully.</p>'}catch(e){show(e.message||'Vote submission failed.','msg err');btn.disabled=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('verifyBtn').onclick=verify;
</script></body></html>
