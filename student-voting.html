:root{--navy:#102f56;--blue:#102f56;--blue2:#00a651;--ink:#172b4d;--muted:#62748a;--line:#dce8e1;--wash:#f3f7f5}*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top left,#e5eefc 0,transparent 42%),var(--wash);color:var(--ink);line-height:1.55}.wrap{max-width:800px;padding:28px 18px 50px}.card{border:1px solid rgba(218,228,241,.9);border-radius:20px;padding:25px;margin:16px 0;box-shadow:0 10px 30px rgba(16,42,67,.055)}.portal-hero{background:linear-gradient(125deg,#102f56 0%,#17416b 72%,#00a651 160%);color:#fff;border:0;padding:30px;position:relative;overflow:hidden}.portal-hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-55px;top:-100px;box-shadow:0 0 0 25px rgba(255,255,255,.035),0 0 0 55px rgba(255,255,255,.025)}.portal-hero h1{font-size:clamp(25px,5vw,36px);line-height:1.15;letter-spacing:-.035em;margin:14px 0 8px}.portal-hero p{margin:0;color:#d8e6f7}.commission-brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#f3c969}.commission-brand span{font-size:12px;font-weight:650;letter-spacing:.02em;text-transform:none;color:#e6effa}.hero-rule{height:1px;background:rgba(255,255,255,.2);margin:20px 0 15px;max-width:740px}h2{letter-spacing:-.02em;color:#183653}input{border:1px solid #ccd8e7;border-radius:11px;padding:13px;background:#fbfdff;color:var(--ink);font:inherit}input:focus{outline:3px solid rgba(37,99,235,.15);border-color:#5b8fe8}.verifyInput{margin:7px 0 16px}label{font-weight:800;color:#fff;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.28)}button{background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:11px;padding:12px 18px;box-shadow:0 3px 8px rgba(23,78,166,.12);transition:transform .15s,filter .15s}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:focus-visible{outline:3px solid #9dc2ff;outline-offset:2px}.msg{border:1px solid #c7d7eb;background:#fff;color:#172b4d;border-radius:12px;padding:14px 16px;font-weight:600;line-height:1.6}.msg.err{background:#fff2f0;color:#9b1c1c;border-color:#f5d0ca}.msg.success{background:#edfbf1;color:#176b2c;border-color:#c7efd1}.err{background:#fff2f0;border-color:#f5d0ca}.success{background:#edfbf1;border-color:#c7efd1}.candidate{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 3px 12px rgba(16,42,67,.035)}.candidate:hover{border-color:#80a9e9;box-shadow:0 7px 18px rgba(23,78,166,.08)}.candidate.selected{border:2px solid var(--blue);background:#f3f7ff}.review{border-left:4px solid #2563eb;border-radius:0 12px 12px 0;padding:14px 16px;background:#f7faff}.nav{gap:12px;margin-top:22px}.small,.progress{color:var(--muted)}@media(max-width:600px){.wrap{padding:12px 11px 28px}.card{padding:17px;border-radius:16px}.portal-hero{padding:22px}.commission-brand{gap:6px}.commission-brand span{flex-basis:100%}.nav button{flex:1}}@media(prefers-reduced-motion:reduce){button{transition:none}}.admin-login-wrap{display:none!important}.admin-login{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#174ea6;color:#fff;border:1px solid #fff;border-radius:10px;padding:11px 16px;font-weight:800;text-decoration:none;box-shadow:0 3px 8px rgba(16,42,67,.12)}.admin-login:hover{background:#103b83;color:#fff;filter:none;transform:translateY(-1px)}.admin-access-footer{margin:18px 0 0;padding:16px 18px;text-align:center;background:#fff;border:1px solid #dce6f3;border-radius:14px;color:#62748a;font-size:13px}.admin-access-footer p{margin:0 0 9px}.admin-access-footer a{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-weight:800;text-decoration:none;padding:11px 16px;border:1px solid #174ea6;border-radius:9px;background:#174ea6;min-width:180px}.admin-access-footer a:hover{background:#103b83;color:#fff}

.bamssa-logo{width:64px;height:64px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;flex-shrink:0}.commission-brand{display:flex;align-items:center;gap:12px}.commission-brand span{color:#e6effa}.about-bamssa summary,.how-to-vote summary{cursor:pointer;font-weight:800;color:#102f56}.about-bamssa-content,.how-to-vote-content{padding-top:10px}.portal-info{position:relative;background:#fff;color:#183653;border:1px solid #dce7f3;border-radius:14px;padding:16px 18px;margin-top:16px;z-index:1}.portal-info h2{margin:0 0 8px;color:#12365a;font-size:19px}.portal-info p{margin:7px 0;color:#344b63}.portal-info ol{padding-left:22px;margin:8px 0}.portal-info li{padding:3px 0}.portal-info strong{color:#12365a}.portal-info .small{color:#62748a}</style></head><body><div class="wrap"><div class="card portal-hero"><div class="commission-brand"><img class="bamssa-logo" src="/bamssa-logo.jpg" alt="BAMSSA emblem"> <span><strong>BAMSEC</strong><br>Basic Medical Sciences Student Electoral Commission</span></div><div class="hero-rule"></div><h1>BMS Faculty Election 2026</h1><p>University of Delta, Agbor</p><div id="msg" class="msg">Enter your registered name, matric number and personal election PIN to verify your eligibility.</div><div id="verify"><label>Full name</label><input class="verifyInput" id="name" placeholder="Enter your full name"><label>Matric number</label><input class="verifyInput" id="matric" placeholder="Enter your matric number"><label>Election PIN</label><input class="verifyInput" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Enter your 6 digit election PIN"><button id="verifyBtn">Verify voter</button></div><div id="publicResults" style="display:none"></div><div id="ballot" style="display:none"></div></div><footer class="admin-access-footer" id="adminAccessFooter"><p>Election officials only</p><a href="admin.html">Login as Admin <span aria-hidden="true">↗</span></a></footer></div><script>
const {createClient}=supabase;const db=createClient('https://dlzjnxhvcysknajtxhij.supabase.co','sb_publishable_xl4C_1obFH_6z-thh_eMBw_0M2RMHpu');
const ELECTION='024a7a81-13dc-4fb2-adff-4851a29e0084';let voter=null,verificationToken=null,positions=[],candidates=[],current=0,selections={};
const msg=document.getElementById('msg');loadPublicResults();function show(t,c='msg'){msg.className=c;msg.textContent=t}
async function loadPublicResults(){
  const box=document.getElementById('publicResults');
  try{
    const {data,error}=await db.rpc('get_election_results',{p_election_id:ELECTION});
    if(error||!data||data.published!==true){box.style.display='none';return}
    window.publicElectionResults=data;
    let html='<h2>Official Election Results</h2><p class="msg success">These results have been officially published by the electoral chairman.</p>';
    html+='<button type="button" onclick="downloadPublicResultsPDF()">Download Official Results (PDF)</button>';
    html+=`<div class="review"><strong>Eligible to vote</strong><br><span style="font-size:24px;font-weight:800">${Number(data.eligible_voters)||0}</span></div>`;
    html+=`<div class="review"><strong>People who voted</strong><br><span style="font-size:24px;font-weight:800">${Number(data.voted_voters)||0}</span></div>`;
    const turnout=Number(data.eligible_voters)>0?((Number(data.voted_voters)||0)/Number(data.eligible_voters)*100).toFixed(1):'0.0';
    html+=`<p><strong>Voter turnout:</strong> ${turnout}%</p>`;
    for(const p of (data.positions||[])){
      const rows=[...(p.candidates||[]).map(c=>({name:c.candidate_name,votes:Number(c.votes)||0})),...(Number(p.nil_votes)>0||!(p.candidates||[]).length?[{name:'Nil',votes:Number(p.nil_votes)||0}]:[])];
      const total=rows.reduce((n,r)=>n+r.votes,0),max=Math.max(0,...rows.map(r=>r.votes)),leaders=rows.filter(r=>r.votes===max&&max>0);
      html+=`<div class="review"><h3 style="margin-top:0">${esc(p.position_name)}</h3>`;
      if(leaders.length===1)html+=`<p><strong>Leading candidate:</strong> ${esc(leaders[0].name)}</p>`;
      else if(leaders.length>1)html+='<p><strong>Result:</strong> Tie between the highest-vote candidates.</p>';
      for(const r of rows){
        const pct=total>0?(r.votes/total*100).toFixed(1):'0.0';
        html+=`<div style="border-top:1px solid #eee;padding:9px 0"><div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(r.name)}</span><strong>${r.votes} vote${r.votes===1?'':'s'}</strong></div><small>${pct}% of votes recorded for this position</small></div>`;
      }
      html+=`<p><strong>Total votes recorded for this position:</strong> ${total}</p></div>`;
    }
    box.innerHTML=html;box.style.display='block';
  }catch(e){box.style.display='none'}
}
function downloadPublicResultsPDF(){
  const data=window.publicElectionResults;
  if(!data){alert('Official results are not available yet.');return}
  if(!window.jspdf?.jsPDF){alert('The PDF generator could not load. Please refresh the page and try again.');return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const margin=16,width=178;let y=18;
  const ensure=(h=8)=>{if(y+h>280){doc.addPage();y=18}};
  const wrapped=(text,size=9,bold=false)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);const lines=doc.splitTextToSize(String(text??'—'),width);for(const line of lines){ensure(5);doc.text(line,margin,y);y+=4.5}};
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('BAMSSA Faculty Election 2026',margin,y);y+=8;
  doc.setFontSize(13);doc.text('Official Election Results',margin,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Generated: '+new Date().toLocaleString(),margin,y);y+=7;
  const eligible=Number(data.eligible_voters)||0,voted=Number(data.voted_voters)||0;
  wrapped('Eligible voters: '+eligible+'    |    Voters who voted: '+voted+'    |    Turnout: '+(eligible?(voted/eligible*100).toFixed(1):'0.0')+'%');
  y+=3;
  for(const p of (data.positions||[])){
    ensure(18);doc.setFillColor(230,238,248);doc.rect(margin-1,y-5,width+2,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(String(p.position_name||'Position'),margin,y);y+=8;
    const rows=[...(p.candidates||[]).map(c=>({name:c.candidate_name,votes:Number(c.votes)||0})),...(Number(p.nil_votes)>0||!(p.candidates||[]).length?[{name:'Nil',votes:Number(p.nil_votes)||0}]:[])];
    const total=rows.reduce((n,r)=>n+r.votes,0),max=Math.max(0,...rows.map(r=>r.votes)),leaders=rows.filter(r=>r.votes===max&&max>0);
    if(leaders.length===1)wrapped('Highest votes: '+leaders[0].name+' ('+leaders[0].votes+')',9,true);
    else if(leaders.length>1)wrapped('Tie at the highest vote count: '+leaders.map(r=>r.name).join(', '),9,true);
    for(const r of rows){
      ensure(12);const pct=total?(r.votes/total*100).toFixed(1):'0.0';
      doc.setFont('helvetica','normal');doc.setFontSize(9);
      const label=String(r.name||'Candidate');const lines=doc.splitTextToSize(label,width-48);
      doc.text(lines,margin,y);doc.text(String(r.votes),margin+width-35,y);doc.text(pct+'%',margin+width,y,{align:'right'});
      y+=Math.max(5,lines.length*4)+1;
    }
    wrapped('Total votes recorded: '+total,8,false);y+=4;
  }
  ensure(10);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('This report contains aggregate results only. No voter identities or individual ballots are included.',margin,y);
  doc.save('BAMSSA-Faculty-Election-2026-Official-Results.pdf');
}
async function verify(){const name=document.getElementById('name').value.trim(),matric=document.getElementById('matric').value.trim(),pin=document.getElementById('pin').value.trim();if(!name||!matric||!pin)return show('Please enter your full name, matric number and election PIN.','msg err');if(!/^\d{6}$/.test(pin))return show('Your election PIN must be exactly 6 digits.','msg err');document.getElementById('verifyBtn').disabled=true;show('Verifying...');try{const {data,error}=await db.rpc('verify_voter_with_pin',{p_election_id:ELECTION,p_matric_number:matric,p_full_name:name,p_pin:pin});if(error)throw error;if(!data||!data.length)throw new Error('Voter details or election PIN could not be verified.');voter=data[0];verificationToken=voter.verification_token;await loadBallot();if(voter.has_voted){renderVotedBallot(voter.voted_selections||[]);}}catch(e){show(e.message||'Verification failed.','msg err')}finally{document.getElementById('verifyBtn').disabled=false}}
async function loadBallot(){const [{data:p,error:pe},{data:c,error:ce},{data:election,error:ee}]=await Promise.all([db.from('positions').select('*').eq('election_id',ELECTION).order('display_order'),db.from('candidates').select('*').eq('active',true).order('display_order'),db.from('elections').select('status,starts_at,ends_at').eq('id',ELECTION).single()]);if(pe||ce||ee)throw(pe||ce||ee);positions=p||[];candidates=c||[];if(!positions.length)throw new Error('No voting positions have been configured yet.');document.getElementById('verify').style.display='none';document.getElementById('msg').style.display='none';document.querySelectorAll('.portal-info').forEach(el=>el.style.display='none');document.querySelector('.portal-hero').style.display='none';document.getElementById('adminAccessFooter').style.display='none';document.getElementById('publicResults').style.display='none';document.getElementById('ballot').style.display='block';if(!voter.has_voted&&election.status!=='open')throw new Error('Voting is not currently open.');if(!voter.has_voted)renderPosition()}
function renderVotedBallot(voted){const byPosition={};(voted||[]).forEach(v=>byPosition[v.position_id]=v.candidate_id);let html=workspaceHeader();html+='<h2>Vote Already Submitted</h2><p class="msg success">Your vote has been recorded. You can review your selections below, but you cannot vote again.</p>';positions.forEach(p=>{const cs=candidates.filter(c=>c.position_id===p.id);const cid=Object.prototype.hasOwnProperty.call(byPosition,p.id)?byPosition[p.id]:undefined;const choice=cid===null?'Nil':(cs.find(c=>c.id===cid)||{}).full_name||'No recorded selection';html+=`<div class="review"><strong>${esc(p.name)}</strong><br><span>${esc(choice)}</span></div>`});html+='</div>';document.getElementById('ballot').innerHTML=html}
function workspaceHeader(){return `<div class="student-workspace"><div class="student-welcome"><h2>Welcome, ${esc(voter?.full_name||'Student')}</h2><p>Your verified student voting portal</p></div><div class="student-tools"><button type="button" class="secondary" onclick="renderCandidateDirectory()">View All Positions &amp; Candidates</button></div>`}
function renderPosition(){if(current>=positions.length)return renderReview();const p=positions[current],cs=candidates.filter(c=>c.position_id===p.id);let html=workspaceHeader();html+=`<div class="progress">Position ${current+1} of ${positions.length}</div><h2>${esc(p.name)}</h2><p>${cs.length===1?'One candidate is contesting this position. You may vote for the candidate or choose Nil.':'Select one candidate for this position.'}</p>`;if(!cs.length)html+='<p class="msg err">No active candidates are available for this position. Contact the electoral committee.</p>';cs.forEach(c=>{const sel=selections[p.id]===c.id;html+=`<div class="candidate ${sel?'selected':''}" onclick="choose('${esc(c.id)}','${esc(p.id)}')"><label><input type="radio" name="currentPosition" ${sel?'checked':''} onchange="choose('${esc(c.id)}','${esc(p.id)}')"><div class="candidateInfo"><div class="candidateLayout"><div class="candidateProfile">${c.photo_url?`<img src="${esc(c.photo_url)}" alt="Photo of ${esc(c.full_name)}">`:'<div class="candidate-photo-placeholder">Candidate photo unavailable</div>'}<div class="candidateName">${esc(c.full_name)}</div>${c.department?`<div class="candidateDepartment">${esc(c.department)}</div>`:''}</div><div class="manifesto"><strong>Manifesto</strong><p>${c.manifesto?esc(c.manifesto):'No manifesto provided.'}</p></div></div></div></label></div>`});if(cs.length===1){const nil=selections[p.id]===null;html+=`<div class="candidate ${nil?'selected':''}" onclick="chooseNil('${esc(p.id)}')"><label><input type="radio" name="currentPosition" ${nil?'checked':''}><div class="candidateInfo"><strong>Nil</strong><div class="small">I choose not to vote for this candidate.</div></div></label></div>`}html+=`<div class="nav">${current>0?'<button class="secondary" onclick="prevPosition()">Back</button>':'<span></span>'}<button id="nextBtn" onclick="nextPosition()">${current===positions.length-1?'Review vote':'Next'}</button></div></div>`;document.getElementById('ballot').innerHTML=html}
function renderCandidateDirectory(){let html=workspaceHeader();html+='<h2>All Positions &amp; Candidates</h2><p>Review the candidates and their manifestos before returning to your ballot.</p>';positions.forEach((p,i)=>{const cs=candidates.filter(c=>c.position_id===p.id);html+=`<section><h3>${i+1}. ${esc(p.name)}</h3>`;if(!cs.length)html+='<p>No active candidates listed.</p>';cs.forEach(c=>{html+=`<div class="candidate-directory-item">${c.photo_url?`<img src="${esc(c.photo_url)}" alt="Photo of ${esc(c.full_name)}">`:'<div class="candidate-photo-placeholder">Photo unavailable</div>'}<div><strong class="candidateName">${esc(c.full_name)}</strong>${c.department?`<div class="candidateDepartment">${esc(c.department)}</div>`:''}<div class="manifesto"><strong>Manifesto</strong><p>${c.manifesto?esc(c.manifesto):'No manifesto provided.'}</p></div></div></div>`});html+='</section>'});html+='<button type="button" onclick="renderPosition()">Return to Ballot</button></div>';document.getElementById('ballot').innerHTML=html}
function choose(cid,pid){selections[pid]=cid;renderPosition()}
function chooseNil(pid){selections[pid]=null;renderPosition()}
function nextPosition(){const p=positions[current];const cs=candidates.filter(c=>c.position_id===p.id);if(cs.length===0){alert('No active candidate is available for '+p.name+'. Please contact the electoral committee.');return}if(!Object.prototype.hasOwnProperty.call(selections,p.id)){alert('Please select a candidate or Nil for '+p.name+' before continuing.');return}if(cs.length!==1&&selections[p.id]===null){alert('Nil is only available when exactly one candidate is contesting '+p.name+'.');return}current++;renderPosition()}
function prevPosition(){if(current>0)current--;renderPosition()}
function renderReview(){let html=workspaceHeader();html+='<h2>Review Your Vote</h2><p>Every position must have a selection before you can submit your vote. Check your choices below.</p>';let complete=true;positions.forEach((p,i)=>{const c=candidates.find(x=>x.id===selections[p.id]);const has=Object.prototype.hasOwnProperty.call(selections,p.id);if(!has)complete=false;const choice=!has?'Not selected':(selections[p.id]===null?'Nil':(c?esc(c.full_name):'No selection'));html+=`<div class="review"><strong>${esc(p.name)}</strong><br>${choice}<br><button class="secondary" style="margin-top:8px" onclick="editPosition(${i})">Change</button></div>`});html+=`<div class="nav"><button class="secondary" onclick="prevPosition()">Back</button><button id="submitBtn" onclick="submitVote()" ${complete?'':'disabled'}>Submit Vote</button></div>`;html+='</div>';document.getElementById('ballot').innerHTML=html}
function editPosition(i){current=i;renderPosition()}
async function submitVote(){const btn=document.getElementById('submitBtn');const missing=positions.filter(p=>!Object.prototype.hasOwnProperty.call(selections,p.id));if(missing.length){alert('Please make a selection for every position before submitting: '+missing.map(p=>p.name).join(', '));return}const selectionsArray=positions.map(p=>({position_id:p.id,candidate_id:selections[p.id]}));if(!confirm('Submit your vote? You will not be able to vote again.'))return;btn.disabled=true;try{const {data,error}=await db.rpc('cast_votes',{p_election_id:ELECTION,p_verification_token:verificationToken,p_selections:selectionsArray});if(error)throw error;document.getElementById('ballot').innerHTML='<div class="student-workspace"><div class="student-welcome"><h2>Vote Submitted Successfully</h2><p>Thank you for participating in the BAMSSA Faculty Election 2026.</p></div><p>Your vote has been recorded. You cannot vote again.</p></div>'}catch(e){alert(e.message||'Vote submission failed. Please try again.');btn.disabled=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('verifyBtn').onclick=verify;
</script></body></html>
